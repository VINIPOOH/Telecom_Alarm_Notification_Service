services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps data under /var/lib/postgresql (17 and older: /var/lib/postgresql/data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      # $$ = literal $, expanded by the shell inside the container, not by compose
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
